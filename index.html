<style>
/* Layout: palco 3D em tela cheia; ficha técnica + configuração flutuando no canto, barra de vistas na base */
:root{
  --bg:#e9e6e1; --panel:rgba(250,248,245,.9); --fg:#22201d; --muted:#6c665e;
  --line:rgba(34,32,29,.14); --accent:#b0662a; --btn:#ffffff; --btn-on:#22201d; --btn-on-fg:#f6f2ec;
  --ok:#2f7a4a; --ok-bg:rgba(47,122,74,.12); --bad:#b3362b; --bad-bg:rgba(179,54,43,.12);
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1b19; --panel:rgba(32,30,28,.88); --fg:#ece7df; --muted:#9a938a;
  --line:rgba(236,231,223,.14); --accent:#d98a45; --btn:#2a2826; --btn-on:#ece7df; --btn-on-fg:#1c1b19;
  --ok:#6cc48d; --ok-bg:rgba(108,196,141,.14); --bad:#ef7a6e; --bad-bg:rgba(239,122,110,.14); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1b19; --panel:rgba(32,30,28,.88); --fg:#ece7df; --muted:#9a938a;
  --line:rgba(236,231,223,.14); --accent:#d98a45; --btn:#2a2826; --btn-on:#ece7df; --btn-on-fg:#1c1b19;
  --ok:#6cc48d; --ok-bg:rgba(108,196,141,.14); --bad:#ef7a6e; --bad-bg:rgba(239,122,110,.14); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}

.card{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  width:min(310px,calc(100vw - 32px));max-height:calc(100% - 100px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;
  background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:10px;padding:14px 16px 14px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:600;font-size:26px;line-height:1;margin:4px 0 2px;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.overall{font-family:var(--mono);font-size:13px;color:var(--accent);margin-bottom:10px;font-variant-numeric:tabular-nums}
dl{margin:0;display:grid;grid-template-columns:1fr auto;border-top:1px solid var(--line)}
dt,dd{margin:0;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
dt{color:var(--muted);padding-right:8px}
dd{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;font-size:12.5px}
.mat{display:flex;gap:12px;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.sw{display:inline-flex;align-items:center;gap:6px}
.sw i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line)}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;border:1px solid var(--line);border-radius:8px}
.seg button{font:500 12.5px var(--body);color:var(--fg);background:transparent;border:0;border-radius:6px;padding:7px 6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--btn-on);color:var(--btn-on-fg)}
.units{display:inline-grid;grid-template-columns:auto auto;gap:2px;padding:2px;border:1px solid var(--line);border-radius:7px;flex:none}
.units button{font:500 12px var(--mono);color:var(--fg);background:transparent;border:0;border-radius:5px;padding:5px 9px;cursor:pointer}
.units button[aria-pressed="true"]{background:var(--accent);color:#fff}
.field{margin-top:10px;display:grid;gap:4px}
.field label{display:flex;justify-content:space-between;font-size:12.5px;gap:8px}
.field output{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.field[aria-disabled="true"]{opacity:.4}
.toggle{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:15px;height:15px}
.chip{margin-top:10px;font-size:12px;padding:6px 9px;border-radius:6px;line-height:1.45}
.chip.ok{color:var(--ok);background:var(--ok-bg)}
.chip.bad{color:var(--bad);background:var(--bad-bg)}
.chip b{font-family:var(--mono);font-weight:500}
.tools{display:flex;gap:6px;align-items:stretch;flex:none}
.collapse{display:grid;place-items:center;width:32px;padding:0;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--fg);cursor:pointer}
.collapse:hover{background:var(--btn)}
.collapse svg{width:14px;height:14px;transition:transform .2s ease}
.card.min .collapse svg{transform:rotate(180deg)}
.card.min .body{display:none}
@media (prefers-reduced-motion: reduce){.collapse svg{transition:none}}

.views{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;gap:4px;padding:4px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:999px;max-width:calc(100vw - 32px);overflow-x:auto}
.views button{font:500 13px var(--body);color:var(--fg);background:transparent;border:0;border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.views button:hover{background:var(--btn)}
.views button[aria-pressed="true"]{background:var(--btn-on);color:var(--btn-on-fg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));
  width:236px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.hint-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hint .collapse{width:28px;height:28px}
.hint.min .hint-body{display:none}
.hint.min .collapse svg{transform:rotate(180deg)}
.hint-body{display:grid;margin-top:8px;border-top:1px solid var(--line)}
.ctl{display:grid;grid-template-columns:20px 1fr auto;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.ctl:last-child{border-bottom:0;padding-bottom:0}
.ctl svg{width:16px;height:22px;justify-self:center}
.ctl .k{font-size:12.5px;color:var(--muted)}
.ctl .v{font:600 12.5px var(--mono);color:var(--fg)}
.mouse-o{fill:none;stroke:var(--fg);stroke-width:1.3}
.mouse-on{fill:var(--accent)}
.lbl{position:absolute;font-family:var(--mono);font-size:11.5px;color:var(--fg);background:var(--panel);border:1px solid var(--line);
  padding:2px 6px;border-radius:4px;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.lbl.slot{border-color:var(--accent);color:var(--accent)}
#labels{position:fixed;inset:0;pointer-events:none}
#err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
/* ---------- Alternância 3D / prancha SVG ---------- */
.modes{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;gap:4px;padding:4px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:999px;z-index:5}
.modes button{font:500 13px var(--body);color:var(--fg);background:transparent;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;white-space:nowrap}
.modes button:hover{background:var(--btn)}
.modes button[aria-pressed="true"]{background:var(--accent);color:#fff}
body.svg-mode #stage,body.svg-mode #labels,body.svg-mode .card,body.svg-mode .hint,body.svg-mode .views{display:none}
#sheetView{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
#sheetView[hidden]{display:none!important}
.sheet-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.sheet-bar .ttl{display:grid;gap:2px;margin-right:auto;min-width:0}
.sheet-bar .ttl b{font-family:var(--display);font-weight:600;font-size:20px;line-height:1}
.zoom{display:inline-grid;grid-auto-flow:column;gap:2px;padding:2px;border:1px solid var(--line);border-radius:7px}
.zoom button{font:500 12px var(--mono);color:var(--fg);background:transparent;border:0;border-radius:5px;padding:5px 9px;cursor:pointer;min-width:30px;font-variant-numeric:tabular-nums}
.zoom button:hover{background:var(--btn)}
.dl{position:relative}
.dl-btn{display:inline-flex;align-items:center;gap:7px;font:600 13px var(--body);color:#fff;background:var(--accent);border:0;border-radius:7px;padding:8px 13px;cursor:pointer}
.dl-btn:hover{filter:brightness(1.08)}
.dl-btn svg{width:14px;height:14px}
.dl-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;min-width:240px;display:grid;gap:2px;padding:5px;background:var(--panel);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.22)}
.dl-menu button{display:grid;gap:2px;text-align:left;background:transparent;border:0;border-radius:7px;padding:9px 11px;cursor:pointer;color:var(--fg)}
.dl-menu button:hover,.dl-menu button:focus-visible{background:var(--btn)}
.dl-menu b{font:600 13px var(--body)}
.dl-menu span{font:400 11.5px var(--mono);color:var(--muted)}
.dl-status{font:500 12px var(--body);color:var(--muted);min-height:1em}
.dl-status.err{color:var(--bad)}
.sheet-scroll{flex:1;overflow:auto;padding-top:16px;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#sheetHost{width:100%;margin:0 auto}
#sheetHost.zoomed{max-width:none}
#sheetHost svg{display:block;width:100%;height:auto;border-radius:3px;box-shadow:0 10px 40px rgba(0,0,0,.22)}
#sheetHost svg{user-select:none;-webkit-user-select:none}
#sheetScroll.can-pan{cursor:grab}
#sheetScroll.panning{cursor:grabbing}
@media (max-width:760px){ .modes{bottom:calc(68px + env(safe-area-inset-bottom,0px))} body.svg-mode .modes{bottom:calc(16px + env(safe-area-inset-bottom,0px))} }
@media (max-width:560px){
  .hint{display:none}
  .views button{padding:8px 10px;font-size:12.5px}
  h1{font-size:22px}
}
</style>
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<div id="err" hidden>Não foi possível iniciar o WebGL neste navegador.</div>

<aside class="card" id="card">
  <div class="head">
    <div>
      <div class="eyebrow" id="eyebrow">Ficha técnica · cotas em mm</div>
      <h1>Mesa gamer</h1>
    </div>
    <div class="tools">
      <div class="units" role="group" aria-label="Unidade das cotas">
        <button id="uMM" aria-pressed="true">mm</button>
        <button id="uCM" aria-pressed="false">cm</button>
      </div>
      <button class="collapse" id="collapse" aria-expanded="true" aria-label="Recolher painel" title="Recolher painel">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10l4.5-4.5 4.5 4.5"/></svg>
      </button>
    </div>
  </div>
  <div class="overall" id="overall">1400 × 770 × 750 mm</div>
  <div class="body">
    <dl id="spec"></dl>


    <div class="chip ok" id="chip"></div>

    <label class="toggle"><input type="checkbox" id="dims" checked> Mostrar cotas no modelo</label>
  </div>
</aside>

<aside class="hint" id="hint" aria-label="Controles do mouse">
  <div class="hint-head">
    <div class="eyebrow">Controles</div>
    <button class="collapse" id="hintCollapse" aria-expanded="true" aria-label="Recolher controles" title="Recolher controles">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10l4.5-4.5 4.5 4.5"/></svg>
    </button>
  </div>
  <div class="hint-body">
    <div class="ctl"><svg viewBox="0 0 16 22" aria-hidden="true"><path class="mouse-on" d="M8 1.2C4.6 1.2 1.7 3.6 1.7 7.4V9H8V1.2Z"/><rect class="mouse-o" x="1.7" y="1.2" width="12.6" height="19.6" rx="6.3"/><path class="mouse-o" d="M1.7 9H14.3M8 1.2V9"/></svg><span class="k">Mouse esquerdo</span><span class="v">Girar</span></div>
    <div class="ctl"><svg viewBox="0 0 16 22" aria-hidden="true"><rect class="mouse-on" x="6.6" y="3.6" width="2.8" height="4.6" rx="1.4"/><rect class="mouse-o" x="1.7" y="1.2" width="12.6" height="19.6" rx="6.3"/><path class="mouse-o" d="M1.7 9H14.3M8 1.2V9"/></svg><span class="k">Scroll do mouse</span><span class="v">Zoom</span></div>
    <div class="ctl"><svg viewBox="0 0 16 22" aria-hidden="true"><path class="mouse-on" d="M8 1.2c3.4 0 6.3 2.4 6.3 6.2V9H8V1.2Z"/><rect class="mouse-o" x="1.7" y="1.2" width="12.6" height="19.6" rx="6.3"/><path class="mouse-o" d="M1.7 9H14.3M8 1.2V9"/></svg><span class="k">Mouse direito</span><span class="v">Mover</span></div>
  </div>
</aside>

<nav class="views" aria-label="Pontos de vista">
  <button data-view="persp" aria-pressed="true">Perspectiva</button>
  <button data-view="rear" aria-pressed="false">Traseira</button>
  <button data-view="front" aria-pressed="false">Frontal</button>
  <button data-view="side" aria-pressed="false">Lateral</button>
  <button data-view="top" aria-pressed="false">Superior</button>
  <button data-view="under" aria-pressed="false">Inferior</button>
</nav>

<nav class="modes" aria-label="Modo de visualização">
  <button data-mode="3d" aria-pressed="true">3D</button>
  <button data-mode="svg" aria-pressed="false">SVG</button>
</nav>

<section id="sheetView" hidden aria-label="Prancha técnica 2D">
  <div class="sheet-bar">
    <div class="ttl"><span class="eyebrow">Desenho técnico · prancha A3</span><b>Prancha técnica</b></div>
    <div class="units" role="group" aria-label="Unidade das cotas da prancha">
      <button id="sMM" aria-pressed="false">mm</button>
      <button id="sCM" aria-pressed="true">cm</button>
    </div>
    <div class="dl">
      <button class="dl-btn" id="dlBtn" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M3 13.5h10"/></svg>
        Download
      </button>
      <div class="dl-menu" id="dlMenu" role="menu" hidden>
        <button role="menuitem" data-fmt="svg"><b>SVG · vetorial</b><span>Abre em CAD e programas de desenho</span></button>
        <button role="menuitem" data-fmt="png"><b>PNG · alta resolução</b><span>A3 ~300 dpi · imprimir ou WhatsApp</span></button>
      </div>
    </div>
    <span class="dl-status" id="dlStatus" role="status"></span>
    <div class="zoom" role="group" aria-label="Zoom da prancha">
      <button id="zOut" aria-label="Diminuir zoom">−</button>
      <button id="zFit" title="Ajustar à tela">100%</button>
      <button id="zIn" aria-label="Aumentar zoom">+</button>
    </div>
  </div>
  <div class="sheet-scroll" id="sheetScroll"><div id="sheetHost"></div></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  // ---------- Parâmetros (sempre em mm) ----------
  // Eixos: X = comprimento, Y = altura, Z = largura (+Z = frente, onde a pessoa senta; −Z = fundo)
  const P = {
    topL:1400, topW:770, topT:35,
    inset:50, baseH:715,
    tubeA:30, tubeB:30, tubeWall:1.5,   // metalon 30 x 30, chapa 16 (1,5 mm)
    tabL:60, tabW:40, tabT:3, holeL:18, holeW:7,   // abas de fixação: 60 x 40 x 3 com furo oblongo 18 x 7
    railMode:2,                         // 2 = frente + trás · 1 = uma central
    rearSetback:240,                    // borda traseira do tampo → face de trás da travessa traseira
    tray:true,
    trayL:1000, trayD:150, trayH:110, trayLip:35, trayGap:60,   // organizador
    slots:true, slotW:80, slotH:40, slotR:8,                    // passa-cabos: 80 (ao longo do comprimento) × 40, cantos r8
    edgeR:5,                            // boleado das arestas do tampo e dos furos (raio)
    cornerR:25                          // raio dos 4 cantos do tampo, vistos de cima
  };
  const MM = 0.001;
  const baseL=P.topL-2*P.inset, baseW=P.topW-2*P.inset, A=P.tubeA, B=P.tubeB;
  const rearEdge=-P.topW/2;
  // centro dos passa-cabos, medido da borda traseira: sobre o meio da profundidade do organizador
  const slotZ = () => P.trayGap + P.trayD/2;
  const slotXs = () => [-P.trayL/2, 0, P.trayL/2];

  // ---------- Unidades ----------
  let unit='mm';
  try{ const u=localStorage.getItem('mesa-unit'); if(u==='cm'||u==='mm') unit=u; }catch(e){}
  const nf = new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1});
  const n = mm => unit==='mm' ? String(Math.round(mm)) : nf.format(Math.round(mm)/10);
  const nu = mm => n(mm)+' '+unit;

  const stage=document.getElementById('stage');
  let renderer;
  try{ renderer=new THREE.WebGLRenderer({antialias:true}); }
  catch(e){ document.getElementById('err').hidden=false; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.05;
  stage.appendChild(renderer.domElement);

  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(35,1,0.01,50);
  const controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true; controls.dampingFactor=0.08;
  controls.minDistance=0.4; controls.maxDistance=8;
  controls.maxPolarAngle=Math.PI;   // giro livre: a câmera pode passar por baixo da mesa

  // ---------- Tema ----------
  function cssVar(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
  let floorMat, gridMat;
  function applyTheme(){
    const bg=new THREE.Color(cssVar('--bg')||'#e9e6e1');
    scene.background=bg; scene.fog=new THREE.Fog(bg,5,14);
    const dark=bg.getHSL({}).l<0.4;
    if(floorMat) floorMat.opacity=dark?0.55:0.28;
    if(gridMat) gridMat.color.set(dark?0x3a3733:0xc4bfb7);
  }

  // ---------- Madeira procedural ----------
  function rand(seed){ let s=seed; return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }
  function makeWood(){
    const w=2048,h=1024,c=document.createElement('canvas'); c.width=w;c.height=h;
    const g=c.getContext('2d'), r=rand(42);
    const grd=g.createLinearGradient(0,0,0,h);
    grd.addColorStop(0,'#6b4128'); grd.addColorStop(.5,'#774930'); grd.addColorStop(1,'#5f3a22');
    g.fillStyle=grd; g.fillRect(0,0,w,h);
    const planks=6, ph=h/planks;
    for(let i=0;i<planks;i++){
      const tint=(r()-0.5)*26;
      g.fillStyle=`rgba(${tint>0?255:60},${tint>0?220:35},${tint>0?170:10},${Math.abs(tint)/260})`;
      g.fillRect(0,i*ph,w,ph);
    }
    for(let i=0;i<520;i++){
      const y0=r()*h, amp=2+r()*9, freq=0.0015+r()*0.004, ph0=r()*6.28, dark=r()<0.65;
      g.strokeStyle=dark?`rgba(38,18,6,${0.06+r()*0.18})`:`rgba(196,140,92,${0.04+r()*0.10})`;
      g.lineWidth=0.6+r()*2.4; g.beginPath();
      for(let x=0;x<=w;x+=16){ const y=y0+Math.sin(x*freq+ph0)*amp+Math.sin(x*freq*3.1+ph0)*amp*0.3; x?g.lineTo(x,y):g.moveTo(x,y); }
      g.stroke();
    }
    for(let k=0;k<4;k++){
      const cx=r()*w, cy=r()*h;
      for(let j=10;j>0;j--){ g.strokeStyle=`rgba(40,20,6,${0.06+0.03*j/10})`; g.lineWidth=1.2; g.beginPath(); g.ellipse(cx,cy,j*7,j*2.6,0,0,Math.PI*2); g.stroke(); }
    }
    for(let i=1;i<planks;i++){ g.fillStyle='rgba(28,14,4,.16)'; g.fillRect(0,i*ph-1,w,2); }
    const img=g.getImageData(0,0,w,h), d=img.data;
    for(let i=0;i<d.length;i+=4){ const q=(r()-0.5)*14; d[i]+=q; d[i+1]+=q; d[i+2]+=q; }
    g.putImageData(img,0,0);
    return c;
  }
  const woodCanvas=makeWood();
  const aniso=renderer.capabilities.getMaxAnisotropy();
  // Faces do tampo: UV em metros (−0,70…0,70 × −0,385…0,385) → remapeado para 0…1
  const capMap=new THREE.CanvasTexture(woodCanvas); capMap.encoding=THREE.sRGBEncoding; capMap.anisotropy=aniso;
  const capBump=new THREE.CanvasTexture(woodCanvas);
  [capMap,capBump].forEach(t=>{ t.repeat.set(1/(P.topL*MM),1/(P.topW*MM)); t.offset.set(0.5,0.5); });
  // Acabamento liso com verniz de alto brilho: base pouco rugosa + camada de verniz (clearcoat)
  const woodCapMat=new THREE.MeshPhysicalMaterial({map:capMap,bumpMap:capBump,bumpScale:0.00008,roughness:0.38,metalness:0,clearcoat:1,clearcoatRoughness:0.07,envMapIntensity:1.1});
  // Bordas e paredes dos furos (topo da madeira, tom mais escuro)
  const edgeMap=new THREE.CanvasTexture(woodCanvas); edgeMap.encoding=THREE.sRGBEncoding;
  edgeMap.wrapS=edgeMap.wrapT=THREE.RepeatWrapping; edgeMap.repeat.set(0.7,4);
  const woodEdgeMat=new THREE.MeshPhysicalMaterial({map:edgeMap,color:0xc9b49c,roughness:0.42,clearcoat:1,clearcoatRoughness:0.1,envMapIntensity:1.1});
  // Grafite escuro (referência de pintura #575B59). O albedo fica mais escuro que a referência
  // porque a luz do sol e o tone mapping clareiam a peça; assim a cor vista na tela bate com a amostra.
  // Aço carbono com pintura eletrostática preto fosco
  const steelMat=new THREE.MeshStandardMaterial({color:0x0d0e0f,roughness:0.78,metalness:0.15});

  // ---------- Chapa perfurada ----------
  function perfTexture(wMM,hMM,opts){
    const s=2,c=document.createElement('canvas');
    c.width=Math.max(4,Math.round(wMM*s)); c.height=Math.max(4,Math.round(hMM*s));
    const g=c.getContext('2d');
    g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.fillStyle='#000';
    const m=opts.margin, sw=20, sh=6, px=32, py=15;
    const cols=Math.floor((wMM-2*m-sw)/px)+1, rows=Math.floor((hMM-2*m-sh)/py)+1;
    if(cols>0&&rows>0){
      const ox=(wMM-((cols-1)*px+sw))/2, oy=(hMM-((rows-1)*py+sh))/2;
      for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
        const x=(ox+i*px)*s, y=(oy+j*py)*s;
        g.beginPath(); g.roundRect?g.roundRect(x,y,sw*s,sh*s,sh*s/2):g.rect(x,y,sw*s,sh*s); g.fill();
      }
    }
    (opts.cutouts||[]).forEach(([cx,cy,cw,ch])=>g.fillRect((cx-cw/2)*s,(cy-ch/2)*s,cw*s,ch*s));
    const t=new THREE.CanvasTexture(c); t.anisotropy=aniso; return t;
  }
  function perfPanel(wMM,hMM,opts){
    const alpha=perfTexture(wMM,hMM,opts);
    const mat=new THREE.MeshStandardMaterial({color:0x0d0e0f,roughness:0.78,metalness:0.15,alphaMap:alpha,alphaTest:0.5,side:THREE.DoubleSide});
    const mesh=new THREE.Mesh(new THREE.PlaneGeometry(wMM*MM,hMM*MM),mat);
    mesh.castShadow=true; mesh.receiveShadow=true;
    mesh.customDepthMaterial=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,alphaMap:alpha,alphaTest:0.5});
    return mesh;
  }

  // ---------- Ambiente ----------
  const pmrem=new THREE.PMREMGenerator(renderer);
  const envScene=new THREE.Scene(); envScene.background=new THREE.Color(0x888888);
  const panelGeo=new THREE.PlaneGeometry(4,2);
  const pA=new THREE.Mesh(panelGeo,new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide})); pA.position.set(0,3,0); pA.rotation.x=-Math.PI/2; envScene.add(pA);
  const pB=pA.clone(); pB.position.set(3,1.5,0); pB.rotation.set(0,-Math.PI/2,0); envScene.add(pB);
  scene.environment=pmrem.fromScene(envScene,0.04).texture;

  function box(sx,sy,sz,mat){
    const m=new THREE.Mesh(new THREE.BoxGeometry(sx*MM,sy*MM,sz*MM),mat);
    m.castShadow=true; m.receiveShadow=true; return m;
  }

  // ---------- Tampo com passa-cabos ----------
  // Contorno do tampo no plano; furos = retângulos 80 × 40 com cantos arredondados
  function roundedRectPath(p,cx,cy,w,h,r){
    const x0=cx-w/2,x1=cx+w/2,y0=cy-h/2,y1=cy+h/2;
    p.moveTo(x0+r,y0); p.lineTo(x1-r,y0); p.absarc(x1-r,y0+r,r,-Math.PI/2,0,false);
    p.lineTo(x1,y1-r); p.absarc(x1-r,y1-r,r,0,Math.PI/2,false);
    p.lineTo(x0+r,y1); p.absarc(x0+r,y1-r,r,Math.PI/2,Math.PI,false);
    p.lineTo(x0,y0+r); p.absarc(x0+r,y0+r,r,Math.PI,Math.PI*1.5,false);
    return p;
  }
  function buildTop(){
    const hw=P.topL/2*MM, hd=P.topW/2*MM;
    const shape=new THREE.Shape();
    roundedRectPath(shape,0,0,P.topL*MM,P.topW*MM,P.cornerR*MM);   // cantos arredondados
    if(P.slots){
      // y da forma = −Z do mundo (a forma é girada −90° em X)
      const cy=-(rearEdge+slotZ())*MM;
      slotXs().forEach(x=>shape.holes.push(roundedRectPath(new THREE.Path(),x*MM,cy,P.slotW*MM,P.slotH*MM,P.slotR*MM)));
    }
    // Boleado: o bevel arredonda as arestas de cima e de baixo (e dos furos) sem mudar as medidas externas
    const e=P.edgeR*MM;
    const geo=new THREE.ExtrudeGeometry(shape,{depth:(P.topT-2*P.edgeR)*MM,bevelEnabled:true,bevelThickness:e,bevelSize:e,bevelOffset:-e,bevelSegments:6,curveSegments:14});
    geo.translate(0,0,e);
    geo.rotateX(-Math.PI/2);
    const mesh=new THREE.Mesh(geo,[woodCapMat,woodEdgeMat]);
    mesh.position.y=P.baseH*MM; mesh.castShadow=true; mesh.receiveShadow=true;
    return mesh;
  }

  // ---------- Aba de fixação (chapa com furo oblongo) ----------
  // cx, cz = centro (mm); sx, sz = tamanho em X e em Z (mm). O furo é sempre alongado em Z.
  function tabMesh(cx,cz,sx,sz){
    const sh=roundedRectPath(new THREE.Shape(),0,0,sx*MM,sz*MM,3*MM);
    sh.holes.push(roundedRectPath(new THREE.Path(),0,0,P.holeW*MM,P.holeL*MM,(P.holeW/2-0.01)*MM));
    const g=new THREE.ExtrudeGeometry(sh,{depth:P.tabT*MM,bevelEnabled:false,curveSegments:10});
    g.rotateX(-Math.PI/2);
    const m=new THREE.Mesh(g,steelMat); m.castShadow=true; m.receiveShadow=true;
    m.position.set(cx*MM,(P.baseH-P.tabT)*MM,cz*MM);
    return m;
  }

  // ---------- Base, organizador e tampo (reconstruídos ao mudar opções) ----------
  let dyn=null;
  function disposeGroup(g){
    g.traverse(o=>{
      if(o.geometry) o.geometry.dispose();
      if(o.material){ [].concat(o.material).forEach(m=>{ if(m===steelMat||m===woodCapMat||m===woodEdgeMat) return; if(m.alphaMap) m.alphaMap.dispose(); m.dispose(); }); }
      if(o.customDepthMaterial) o.customDepthMaterial.dispose();
    });
  }
  function build(){
    if(dyn){ scene.remove(dyn); disposeGroup(dyn); }
    dyn=new THREE.Group(); scene.add(dyn);
    dyn.add(buildTop());

    // Quadros das cabeceiras
    [-1,1].forEach(sx=>{
      const fx=sx*(baseL/2-B/2);
      [-1,1].forEach(sz=>{ const leg=box(B,P.baseH,A,steelMat); leg.position.set(fx*MM,(P.baseH/2)*MM,sz*(baseW/2-A/2)*MM); dyn.add(leg); });
      [A/2,P.baseH-A/2].forEach(y=>{ const rail=box(B,A,baseW-2*A,steelMat); rail.position.set(fx*MM,y*MM,0); dyn.add(rail); });
    });

    // Travessas longitudinais
    const longLen=baseL-2*B, yRail=(P.baseH-A/2)*MM;
    const railsZ = P.railMode===2 ? [baseW/2-B/2, rearEdge+P.rearSetback+B/2] : [0];
    railsZ.forEach(z=>{ const lg=box(longLen,A,B,steelMat); lg.position.set(0,yRail,z*MM); dyn.add(lg); });

    // Travessa central: transversal, no eixo da mesa (x = 0), ligando a travessa frontal à traseira
    const cz0=rearEdge+P.rearSetback+B, cz1=baseW/2-B;          // face da frente da traseira → face de trás da frontal
    const cross=box(B,A,cz1-cz0,steelMat); cross.position.set(0,yRail,(cz0+cz1)/2*MM); dyn.add(cross);

    // Abas superiores de fixação: chapas soldadas na face interna das travessas, rentes ao topo da base,
    // com furo oblongo no sentido da largura do tampo (Z) para a madeira poder trabalhar.
    const fx=baseL/2-B;                                   // face interna dos quadros
    [-1,1].forEach(sx=>[-1,1].forEach(sz=>dyn.add(tabMesh(sx*(fx-P.tabW/2), sz*180, P.tabW, P.tabL))));
    railsZ.forEach(z=>{
      const dir = z>0 ? -1 : 1;                           // aba aponta para o centro da mesa
      const face = z + dir*B/2;
      [-450,450].forEach(x=>dyn.add(tabMesh(x, face+dir*P.tabW/2, P.tabL, P.tabW)));
    });
    [-1,1].forEach(sx=>dyn.add(tabMesh(sx*(B/2+P.tabW/2), (cz0+cz1)/2, P.tabW, P.tabL)));   // 2 abas na travessa central

    // Organizador de cabos
    if(P.tray){
      const L=P.trayL, D=P.trayD, H=P.trayH, lip=P.trayLip;
      const zBack=rearEdge+P.trayGap, zFront=zBack+D, yTop=P.baseH, yBot=P.baseH-H;
      const tray=new THREE.Group(); dyn.add(tray);
      const wall=perfPanel(L,H,{margin:10}); wall.position.set(0,(yTop+yBot)/2*MM,zBack*MM); tray.add(wall);
      const bottom=perfPanel(L,D,{margin:12,cutouts:[[L*0.22,D/2,90,55],[L*0.78,D/2,90,55]]});
      bottom.rotation.x=-Math.PI/2; bottom.position.set(0,yBot*MM,(zBack+D/2)*MM); tray.add(bottom);
      const front=perfPanel(L,lip,{margin:6}); front.position.set(0,(yBot+lip/2)*MM,zFront*MM); tray.add(front);
      // abas de fixação (ficam atrás dos passa-cabos para não cobri-los)
      [-1,1].forEach(s=>{
        const tab=box(70,3,45,steelMat); tab.position.set(s*(L/2-35)*MM,(yTop-1.5)*MM,(zBack+22.5)*MM); tray.add(tab);
        const fold=box(70,20,3,steelMat); fold.position.set(s*(L/2-35)*MM,(yTop-10)*MM,(zBack+1.5)*MM); tray.add(fold);
      });
    }
    buildDims();
    updatePanel();
  }

  // ---------- Piso e luzes ----------
  floorMat=new THREE.ShadowMaterial({opacity:0.28});
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),floorMat);
  floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
  const grid=new THREE.GridHelper(10,100,0x000000,0x000000);
  gridMat=grid.material; gridMat.transparent=true; gridMat.opacity=0.35; grid.position.y=0.0005; scene.add(grid);

  scene.add(new THREE.HemisphereLight(0xfff4e6,0x8a7f72,0.5));
  scene.add(new THREE.AmbientLight(0xffffff,0.18));
  const sun=new THREE.DirectionalLight(0xfff1e0,2.2);
  sun.position.set(2.2,3.6,1.8); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048); sun.shadow.radius=6; sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.02;
  Object.assign(sun.shadow.camera,{left:-1.6,right:1.6,top:1.6,bottom:-1.6,near:0.5,far:10});
  scene.add(sun);
  const fill=new THREE.DirectionalLight(0xdfe8ff,0.6); fill.position.set(-2.5,1.5,-2.5); scene.add(fill);

  applyTheme();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
  new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

  // ---------- Cotas 3D ----------
  const dimGroup=new THREE.Group(); scene.add(dimGroup);
  // Cotas em vermelho vivo (mesmo padrão da prancha técnica): contrastam com a madeira, o aço preto e o fundo
  const dimMat=new THREE.LineBasicMaterial({color:0xff2d2d});
  const extMat=new THREE.LineBasicMaterial({color:0xff2d2d,transparent:true,opacity:0.75});
  const labelsEl=document.getElementById('labels');
  let labels=[], dimsOn=true;
  const V=(x,y,z)=>new THREE.Vector3(x,y,z);
  function tag(pos,textFn,cls){
    const el=document.createElement('div'); el.className='lbl'+(cls?' '+cls:''); labelsEl.appendChild(el);
    const l={el,pos,textFn}; l.el.textContent=textFn(); labels.push(l);
  }
  function dimLine(a,b,tick,textFn,cls){
    const tk=tick.clone().multiplyScalar(0.022);
    dimGroup.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints([a,b,a.clone().add(tk),a.clone().sub(tk),b.clone().add(tk),b.clone().sub(tk)]),dimMat));
    tag(a.clone().add(b).multiplyScalar(0.5),textFn,cls);
  }
  function extLines(pts){ dimGroup.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),extMat)); }
  function relabel(){ labels.forEach(l=>l.el.textContent=l.textFn()); }

  function buildDims(){
    dimGroup.children.slice().forEach(c=>{ c.geometry.dispose(); dimGroup.remove(c); });
    labels.forEach(l=>l.el.remove()); labels=[];
    const L=P.topL*MM, W=P.topW*MM, H=(P.baseH+P.topT)*MM, yb=P.baseH*MM, off=0.09;
    dimLine(V(-L/2,H,W/2+off),V(L/2,H,W/2+off),V(0,0,1),()=>nu(P.topL));
    dimLine(V(L/2+off,H,-W/2),V(L/2+off,H,W/2),V(1,0,0),()=>nu(P.topW));
    const bl=baseL/2*MM, bw=baseW/2*MM, yf=0.003, x2=L/2+off+0.07;
    // alturas: 750 no plano da borda frontal do tampo, 715 no plano da face frontal dos pés
    dimLine(V(L/2+off,0,W/2),V(L/2+off,H,W/2),V(1,0,0),()=>nu(P.baseH+P.topT));
    dimLine(V(-L/2-off,0,bw),V(-L/2-off,yb,bw),V(1,0,0),()=>nu(P.baseH));
    // linhas de referência (chamada) do tampo e das alturas
    extLines([
      V(-L/2,H,W/2),V(-L/2,H,W/2+off+0.02), V(L/2,H,W/2),V(L/2,H,W/2+off+0.02), V(L/2,H,-W/2),V(L/2+off+0.02,H,-W/2),
      V(L/2,H,W/2),V(L/2+off+0.02,H,W/2), V(L/2,yf,W/2),V(L/2+off+0.02,yf,W/2),
      V(-bl,yb,bw),V(-L/2-off-0.02,yb,bw), V(-bl,yf,bw),V(-L/2-off-0.02,yf,bw)
    ]);
    // pés no chão: comprimento e largura da base, com linhas de referência saindo dos cantos dos pés
    dimLine(V(-bl,yf,W/2+off),V(bl,yf,W/2+off),V(0,0,1),()=>'pés '+nu(baseL));
    dimLine(V(x2,yf,-bw),V(x2,yf,bw),V(1,0,0),()=>'pés '+nu(baseW));
    extLines([
      V(-bl,yf,bw),V(-bl,yf,W/2+off+0.02), V(bl,yf,bw),V(bl,yf,W/2+off+0.02),
      V(bl,yf,-bw),V(x2+0.02,yf,-bw), V(bl,yf,bw),V(x2+0.02,yf,bw)
    ]);
    // espessura do tampo, no canto frontal esquerdo
    const xt=-L/2-off;
    dimLine(V(xt,yb,W/2),V(xt,H,W/2),V(1,0,0),()=>'tampo '+nu(P.topT));
    extLines([V(-L/2,H,W/2),V(xt-0.02,H,W/2), V(-L/2,yb,W/2),V(xt-0.02,yb,W/2)]);
    // perfil do pé
    tag(V(-bl,0.16,bw+0.05),()=>'pé '+n(A)+' × '+n(B)+' '+unit);
    dimLine(V(-0.25,yb-0.002,(P.topW/2-P.inset)*MM),V(-0.25,yb-0.002,W/2),V(1,0,0),()=>nu(P.inset));
    const xd=(P.tray?P.trayL/2+90:300)*MM;
    if(P.railMode===2) dimLine(V(xd,yb-0.002,-W/2),V(xd,yb-0.002,(rearEdge+P.rearSetback)*MM),V(1,0,0),()=>'travessa '+nu(P.rearSetback));
    else dimLine(V(xd,yb-0.002,-W/2),V(xd,yb-0.002,-B/2*MM),V(1,0,0),()=>'travessa '+nu(P.topW/2-B/2));
    // travessa central: comprimento e posição no eixo
    { const c0=rearEdge+P.rearSetback+B, c1=baseW/2-B, xc=0.06;
      dimLine(V(xc,yb-0.002,c0*MM),V(xc,yb-0.002,c1*MM),V(1,0,0),()=>'travessa central '+nu(c1-c0));
      dimLine(V(-L/2,yb-0.002,(c0+c1)/2*MM),V(0,yb-0.002,(c0+c1)/2*MM),V(0,0,1),()=>'eixo '+nu(P.topL/2)); }
    if(P.tray){
      const zb=(rearEdge+P.trayGap)*MM, yBot=(P.baseH-P.trayH)*MM;
      dimLine(V(-P.trayL/2*MM,yBot-0.03,zb),V(P.trayL/2*MM,yBot-0.03,zb),V(0,1,0),()=>'organizador '+nu(P.trayL));
      extLines([V(-P.trayL/2*MM,yBot,zb),V(-P.trayL/2*MM,yBot-0.045,zb),V(P.trayL/2*MM,yBot,zb),V(P.trayL/2*MM,yBot-0.045,zb)]);
    }
    if(P.slots){
      const zc=(rearEdge+slotZ())*MM, ys=H+0.001, zr=-W/2-0.07;
      const xs=slotXs().map(x=>x*MM);
      // espaçamento entre centros, ao longo da borda traseira
      dimLine(V(xs[0],ys,zr),V(xs[1],ys,zr),V(0,0,1),()=>nu(P.trayL/2),'slot');
      dimLine(V(xs[1],ys,zr),V(xs[2],ys,zr),V(0,0,1),()=>nu(P.trayL/2),'slot');
      extLines(xs.flatMap(x=>[V(x,ys,zc),V(x,ys,zr-0.02)]));
      // distância da borda traseira ao centro dos furos
      const xq=xs[2]+0.11;
      dimLine(V(xq,ys,-W/2),V(xq,ys,zc),V(1,0,0),()=>nu(slotZ()),'slot');
      extLines([V(xs[2]+P.slotW/2*MM,ys,zc),V(xq+0.02,ys,zc)]);
      // tamanho do furo
      tag(V(xs[1],ys+0.04,zc),()=>'3× '+n(P.slotW)+' × '+n(P.slotH)+' '+unit,'slot');
    }
    setDims(dimsOn);
  }
  function setDims(on){ dimsOn=on; dimGroup.visible=on; labels.forEach(l=>l.el.hidden=!on); }
  document.getElementById('dims').addEventListener('change',e=>setDims(e.target.checked));

  const pv=new THREE.Vector3();
  function updateLabels(w,h){
    if(!dimsOn) return;
    labels.forEach(l=>{
      pv.copy(l.pos).project(camera);
      l.el.style.display=(pv.z<1&&pv.z>-1)?'':'none';
      l.el.style.left=((pv.x+1)/2*w)+'px';
      l.el.style.top=((1-pv.y)/2*h)+'px';
    });
  }

  // ---------- Painel ----------
  const $=id=>document.getElementById(id);
  function updatePanel(){
    $('uMM').setAttribute('aria-pressed',unit==='mm');
    $('uCM').setAttribute('aria-pressed',unit==='cm');
    $('eyebrow').textContent='Ficha técnica · cotas em '+unit;
    $('overall').textContent=n(P.topL)+' × '+n(P.topW)+' × '+n(P.baseH+P.topT)+' '+unit;

    const rows=[
      ['Tampo (C × L)', n(P.topL)+' × '+n(P.topW)],
      ['Espessura do tampo', n(P.topT)],
      ['Boleado das arestas (raio)', n(P.edgeR)],
      ['Cantos do tampo (raio)', n(P.cornerR)],
      ['Recuo dos quadros', n(P.inset)],
      ['Vão da base (C × L)', n(baseL)+' × '+n(baseW)],
      ['Altura da base', n(P.baseH)],
      ['Metalon (aço carbono)', n(P.tubeA)+' × '+n(P.tubeB)],
      ['Parede do tubo', 'chapa 16 · 1,5 mm'],
      ['Abas de fixação', '10 × '+n(P.tabL)+' × '+n(P.tabW)],
      ['Furo das abas (oblongo)', n(P.holeL)+' × '+n(P.holeW)],
      ['Acabamento da base', 'eletrostática preto fosco'],
      ['Altura total', n(P.baseH)+' + '+n(P.topT)+' = '+n(P.baseH+P.topT)],
      P.railMode===2 ? ['Travessas','frente '+n(P.inset)+' · trás '+n(P.rearSetback)] : ['Travessa','única, central'],
      ['Travessa central', 'no eixo · '+n((P.topW/2-P.inset-B)-(-P.topW/2+P.rearSetback+B))+' × '+n(P.tubeA)+' × '+n(P.tubeB)],
      ['Organizador (C × P × A)', P.tray ? n(P.trayL)+' × '+n(P.trayD)+' × '+n(P.trayH) : 'não'],
    ];
    if(P.slots){
      rows.push(['Passa-cabos (3×)', n(P.slotW)+' × '+n(P.slotH)]);
      rows.push(['Centros dos furos', n(-P.trayL/2+P.topL/2)+' · '+n(P.topL/2)+' · '+n(P.trayL/2+P.topL/2)]);
      rows.push(['Do fundo ao centro', n(slotZ())]);
    }
    $('spec').innerHTML=rows.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('');


    // Verificações
    const msgs=[]; let bad=false;
    if(P.tray){
      const trayFront=P.trayGap+P.trayD;
      const railBack=P.railMode===2?P.rearSetback:P.topW/2-B/2;
      const gap=railBack-trayFront;
      if(gap<0){ bad=true; msgs.push('Organizador encosta na travessa: faltam <b>'+nu(-gap)+'</b>. Recue a travessa para <b>'+nu(trayFront)+'</b> ou mais.'); }
      else if(gap<20){ bad=true; msgs.push('Folga apertada: <b>'+nu(gap)+'</b> entre organizador e travessa (ideal ≥ '+nu(20)+').'); }
      else msgs.push('Folga organizador ↔ travessa: <b>'+nu(gap)+'</b>');
    }
    if(P.slots){
      const outer=P.trayL/2+P.slotW/2, frameInner=baseL/2-B;
      if(outer>frameInner){ bad=true; msgs.push('Os furos das pontas caem em cima do quadro da base. Use organizador de até <b>'+nu(2*(frameInner-P.slotW/2))+'</b>.'); }
      else msgs.push('Furos das pontas a <b>'+nu(frameInner-outer)+'</b> do quadro');
    }
    const chip=$('chip');
    chip.hidden=!msgs.length;
    chip.className='chip '+(bad?'bad':'ok');
    chip.innerHTML=msgs.join('<br>');
  }
  function setUnit(u){ unit=u; try{ localStorage.setItem('mesa-unit',u); }catch(e){} updatePanel(); relabel(); }
  $('uMM').addEventListener('click',()=>setUnit('mm'));
  $('uCM').addEventListener('click',()=>setUnit('cm'));

  // ---------- Vistas ----------
  const VIEWS={
    persp:{pos:[2.15,1.45,2.35], tgt:[0,0.38,0]},
    rear: {pos:[1.25,0.42,-2.2], tgt:[0,0.6,-0.1]},
    front:{pos:[0,0.42,3.4],     tgt:[0,0.38,0]},
    side: {pos:[3.2,0.42,0],     tgt:[0,0.38,0]},
    top:  {pos:[0,3.6,0.0001],   tgt:[0,0.38,0]},
    under:{pos:[0.55,-1.5,0.9],  tgt:[0,0.62,0]}
  };
  let anim=null;
  function goTo(name,instant){
    const vw=VIEWS[name], toP=V(...vw.pos), toT=V(...vw.tgt);
    if(instant||matchMedia('(prefers-reduced-motion: reduce)').matches){ camera.position.copy(toP); controls.target.copy(toT); controls.update(); return; }
    anim={t0:performance.now(),dur:900,fromP:camera.position.clone(),fromT:controls.target.clone(),toP,toT};
  }
  document.querySelectorAll('.views button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.views button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    goTo(b.dataset.view);
  }));
  controls.addEventListener('start',()=>{ anim=null; });

  const card=$('card'), col=$('collapse');
  function setMin(min){ card.classList.toggle('min',min); const t=min?'Expandir painel':'Recolher painel'; col.setAttribute('aria-label',t); col.title=t; col.setAttribute('aria-expanded',!min); }
  col.addEventListener('click',()=>setMin(!card.classList.contains('min')));
  const hint=$('hint'), hcol=$('hintCollapse');
  function setHintMin(min){ hint.classList.toggle('min',min); const t=min?'Expandir controles':'Recolher controles'; hcol.setAttribute('aria-label',t); hcol.title=t; hcol.setAttribute('aria-expanded',!min); }
  hcol.addEventListener('click',()=>setHintMin(!hint.classList.contains('min')));
  if(window.innerWidth<560) setMin(true);

  // ---------- Loop ----------
  function resize(){
    const w=stage.clientWidth,h=stage.clientHeight;
    renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov=w/h<0.8?52:35; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize',resize);
  resize(); build(); goTo('persp',true);

  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  function tick(now){
    if(anim){
      const k=Math.min(1,(now-anim.t0)/anim.dur), e=ease(k);
      camera.position.lerpVectors(anim.fromP,anim.toP,e);
      controls.target.lerpVectors(anim.fromT,anim.toT,e);
      if(k>=1) anim=null;
    }
    if(document.body.classList.contains('svg-mode')){ requestAnimationFrame(tick); return; }   // prancha aberta: pausa o 3D
    controls.update();
    grid.visible=camera.position.y>0;   // abaixo do piso, esconde a grade para ver a parte de baixo
    renderer.render(scene,camera);
    updateLabels(stage.clientWidth,stage.clientHeight);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>

<script>
// Prancha técnica 2D da Mesa Gamer — gera um SVG (A3 paisagem, 1400 x 990 unidades)
// Todas as medidas de projeto em mm. unit = 'mm' | 'cm' controla só os textos das cotas.
function buildSheet(unit){
  unit = unit==='mm' ? 'mm' : 'cm';
  const S = 1/3;                       // vistas principais: 1:10 quando impressas em A3
  const v = mm => { const x = unit==='mm' ? mm : mm/10; return String(+x.toFixed(2)).replace('.',','); };
  const f = n => +(+n).toFixed(2);
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const o = []; const p = s => o.push(s);
  const line = (x1,y1,x2,y2,c,extra) => p(`<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" class="${c}"${extra||''}/>`);
  const rect = (x,y,w,h,c,rx) => p(`<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}"${rx?` rx="${f(rx)}"`:''} class="${c}"/>`);
  const path = (d,c,extra) => p(`<path d="${d}" class="${c}"${extra||''}/>`);
  const text = (x,y,s,c,anchor,rot) => p(`<text x="${f(x)}" y="${f(y)}" class="${c}"${anchor?` text-anchor="${anchor}"`:''}${rot?` transform="rotate(${rot} ${f(x)} ${f(y)})"`:''}>${esc(s)}</text>`);
  const AR = ' marker-end="url(#ar)"', AR2 = ' marker-start="url(#ar)" marker-end="url(#ar)"';

  // ---------- Cotas ----------
  const GAP=3, OVR=4, MIN=15;
  function arrowsH(xa,xb,y,label,opt){
    opt=opt||{}; const a=Math.min(xa,xb), b=Math.max(xa,xb);
    if(b-a>=MIN){ line(a,y,b,y,'d',AR2); text((a+b)/2+(opt.dx||0),y-2.6,label,'dt','middle'); }
    else{
      line(a,y,b,y,'d'); line(a-9,y,a,y,'d',AR); line(b+9,y,b,y,'d',AR);
      if(opt.left) text(a-11,y+3,label,'dt','end'); else text(b+11,y+3,label,'dt','start');
    }
  }
  function arrowsV(ya,yb,x,label,opt){
    opt=opt||{}; const a=Math.min(ya,yb), b=Math.max(ya,yb);
    if(b-a>=MIN){ line(x,a,x,b,'d',AR2); text(x-2.6,(a+b)/2+(opt.dy||0),label,'dt','middle',-90); }
    else{
      line(x,a,x,b,'d'); line(x,a-9,x,a,'d',AR); line(x,b+9,x,b,'d',AR);
      if(opt.left) text(x-4,(a+b)/2+3,label,'dt','end'); else text(x+4,(a+b)/2+3,label,'dt','start');
    }
  }
  function ext(x1,y1,x2,y2){ // linha de chamada: de um ponto do objeto até além da linha de cota
    const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy); if(L<GAP) return;
    const ux=dx/L, uy=dy/L; line(x1+ux*GAP,y1+uy*GAP,x2+ux*OVR,y2+uy*OVR,'d');
  }
  function dimH(xa,ya,xb,yb,yd,label,opt){ if(ya!=null) ext(xa,ya,xa,yd); if(yb!=null) ext(xb,yb,xb,yd); arrowsH(xa,xb,yd,label,opt); }
  function dimV(xa,ya,xb,yb,xd,label,opt){ if(xa!=null) ext(xa,ya,xd,ya); if(xb!=null) ext(xb,yb,xd,yb); arrowsV(ya,yb,xd,label,opt); }
  function leader(x0,y0,x1,y1,label,anchor){ // chamada de texto (cinza)
    p(`<circle cx="${f(x0)}" cy="${f(y0)}" r="1.3" class="ldot"/>`);
    line(x0,y0,x1,y1,'ld');
    const r = anchor==='end' ? -10 : 10;
    line(x1,y1,x1+r,y1,'ld');
    text(x1+r+(anchor==='end'?-2:2),y1+2.6,label,'lt',anchor==='end'?'end':'start');
  }
  function radius(x0,y0,x1,y1,label,anchor){ // cota de raio (vermelha, seta no arco)
    line(x1,y1,x0,y0,'d',AR);
    text(x1+(anchor==='end'?-3:3),y1+(y1<y0?-3:9),label,'dt',anchor||'start');
  }
  function title(x,y,code,name,sub){
    text(x,y,code,'vc'); text(x+34,y,name,'vt');
    line(x,y+4,x+250,y+4,'tl');
    if(sub) text(x,y+15,sub,'vs');
  }
  function ground(x0,x1,y){ rect(x0,y,x1-x0,6,'gh'); line(x0,y,x1,y,'o'); }

  // ---------- Medidas do projeto (mm) ----------
  const L=1400, W=770, T=35, H=750, BH=715, A=30, B=30, IN=50;          // metalon 30 x 30
  const BL=1300, BW=670, FX=BL/2-B;         // FX = face interna dos quadros (610)
  const legZ=BW/2-A;                        // 275: face interna dos pés no sentido Z
  const RF=BW/2-B, RB=-W/2+240;             // travessa frontal: z 295..335 · traseira: z -145..-105
  const CZ0=RB+B, CZ1=RF, CL=CZ1-CZ0;        // travessa central (eixo x = 0): z -105..295, 400 mm
  const TR={x:500, z0:-325, z1:-175, y0:BH-110, lip:35};
  const SLX=[-500,0,500], SLZ=-W/2+135, SW=80, SH=40, SR=8;
  const tabsFrame=[], tabsRail=[];
  [-1,1].forEach(sx=>[-1,1].forEach(sz=>tabsFrame.push({x:sx*(FX-20),z:sz*180,w:40,d:60})));
  [-450,0,450].forEach(x=>{ tabsRail.push({x,z:RF-B/2-20,w:60,d:40}); tabsRail.push({x,z:RB+B+20,w:60,d:40}); });

  p(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 990" width="1400" height="990" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace">`);
  p(`<title>Mesa Gamer — Prancha técnica</title>`);
  p(`<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6.5" markerHeight="6.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.6 L10,5 L0,8.4 z" fill="#d0262b"/></marker>
  <pattern id="hw" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)"><rect width="5" height="5" fill="#f3e9db"/><line x1="0" y1="0" x2="0" y2="5" stroke="#9b7650" stroke-width=".6"/></pattern>
  <pattern id="hs" patternUnits="userSpaceOnUse" width="3" height="3" patternTransform="rotate(45)"><rect width="3" height="3" fill="#d9dbdc"/><line x1="0" y1="0" x2="0" y2="3" stroke="#222" stroke-width=".6"/></pattern>
  <pattern id="hg" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a9a" stroke-width=".5"/></pattern>
  <pattern id="perf" patternUnits="userSpaceOnUse" width="10.7" height="5"><rect x="1.5" y="1.6" width="6.6" height="1.8" rx=".9" fill="#9a9c9e"/></pattern>
  <style>
    .paper{fill:#fff}
    .frame{fill:none;stroke:#1b1b1b;stroke-width:1.6}
    .frame2{fill:none;stroke:#1b1b1b;stroke-width:.6}
    .o{fill:none;stroke:#1b1b1b;stroke-width:1.3;stroke-linejoin:round}
    .wood{fill:#f6efe5;stroke:#1b1b1b;stroke-width:1.3;stroke-linejoin:round}
    .woodh{fill:url(#hw);stroke:#1b1b1b;stroke-width:1.2;stroke-linejoin:round}
    .steel{fill:#d4d6d7;stroke:#1b1b1b;stroke-width:1.1;stroke-linejoin:round}
    .steelh{fill:url(#hs);stroke:#1b1b1b;stroke-width:1.1;fill-rule:evenodd}
    .tray{fill:#eceeef;stroke:#1b1b1b;stroke-width:.9}
    .perf{fill:url(#perf);stroke:none}
    .hole{fill:#fff;stroke:#1b1b1b;stroke-width:.8}
    .slot{fill:#fff;stroke:#1b1b1b;stroke-width:1.1}
    .thin{fill:none;stroke:#1b1b1b;stroke-width:.7}
    .faint{fill:none;stroke:#8a8a8a;stroke-width:.5}
    .hid{fill:none;stroke:#3d3d3d;stroke-width:.7;stroke-dasharray:4 2.4}
    .ax{fill:none;stroke:#7a7a7a;stroke-width:.45;stroke-dasharray:12 2.5 2 2.5}
    .d{fill:none;stroke:#d0262b;stroke-width:.6}
    .dt{fill:#d0262b;font-size:11px;font-weight:600}
    .ld{fill:none;stroke:#4a4a4a;stroke-width:.5}
    .ldot{fill:#4a4a4a}
    .lt{fill:#222;font-size:9.4px;font-weight:600;letter-spacing:.01em}
    .lts{fill:#3a3a3a;font-size:8.6px;font-weight:500}
    .gh{fill:url(#hg);stroke:none}
    .tl{stroke:#1b1b1b;stroke-width:.8}
    .vc{fill:#fff;font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-size:13px;font-weight:600}
    .vcb{fill:#1b1b1b}
    .vt{fill:#1b1b1b;font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-size:16px;font-weight:600;letter-spacing:.03em}
    .vs{fill:#555;font-size:8.6px;font-weight:500;letter-spacing:.08em}
    .th{fill:#1b1b1b}
    .tht{fill:#fff;font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-size:14px;font-weight:600;letter-spacing:.08em}
    .tk{fill:#555;font-size:8.6px;font-weight:600;letter-spacing:.06em}
    .tv{fill:#1b1b1b;font-size:10px;font-weight:500}
    .big{fill:#1b1b1b;font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-size:34px;font-weight:600;letter-spacing:.02em}
    .row{fill:none;stroke:#c9c9c9;stroke-width:.5}
    .isoW1{fill:#ecdcc6;stroke:#2a2a2a;stroke-width:.6;stroke-linejoin:round}
    .isoW2{fill:#d9c09f;stroke:#2a2a2a;stroke-width:.6;stroke-linejoin:round}
    .isoW3{fill:#c8a985;stroke:#2a2a2a;stroke-width:.6;stroke-linejoin:round}
    .isoS1{fill:#55585a;stroke:#111;stroke-width:.5;stroke-linejoin:round}
    .isoS2{fill:#2f3133;stroke:#111;stroke-width:.5;stroke-linejoin:round}
    .isoS3{fill:#404244;stroke:#111;stroke-width:.5;stroke-linejoin:round}
    .isoH{fill:#1d1e1f;stroke:#111;stroke-width:.4}
  </style>
</defs>`);

  // folha, margens e moldura
  rect(0,0,1400,990,'paper');
  rect(10,10,1380,970,'frame2');
  rect(20,20,1360,950,'frame');
  // badge dos títulos (fundo preto atrás do código)
  const badge=(x,y,code)=>{ rect(x-2,y-10.5,30,14,'vcb'); text(x+13,y,code,'vc','middle'); };
  function viewTitle(x,y,code,name,sub){ badge(x,y,code); text(x+34,y,name,'vt'); line(x-2,y+5,x+300,y+5,'tl'); if(sub) text(x+34,y+15,sub,'vs'); }

  // ================= M01 — VISTA FRONTAL =================
  const fx = x => 115+(x+700)*S, GY=378, fy = y => GY-y*S;
  viewTitle(40,46,'M01','VISTA FRONTAL','ESCALA 1:10');
  ground(fx(-770),fx(770),GY);
  // calha (atrás da travessa): parte visível abaixo da travessa
  rect(fx(-TR.x),fy(BH-A),2*TR.x*S,(BH-A-TR.y0)*S,'tray');
  line(fx(-TR.x),fy(TR.y0+TR.lip),fx(TR.x),fy(TR.y0+TR.lip),'thin');
  line(fx(-TR.x),fy(BH-A),fx(-TR.x),fy(BH),'hid'); line(fx(TR.x),fy(BH-A),fx(TR.x),fy(BH),'hid');
  // travessa frontal e pés
  rect(fx(-FX),fy(BH),2*FX*S,A*S,'steel');
  rect(fx(-BL/2),fy(BH),B*S,BH*S,'steel'); rect(fx(FX),fy(BH),B*S,BH*S,'steel');
  rect(fx(-B/2),fy(BH),B*S,A*S,'hid');                                   // travessa central (oculta)
  // abas (ocultas sob o tampo, atrás da travessa)
  // tampo + passa-cabos ocultos
  rect(fx(-L/2),fy(H),L*S,T*S,'wood',5*S);
  SLX.forEach(x=>rect(fx(x-SW/2),fy(H),SW*S,T*S,'hid'));
  line(fx(0),fy(H)-14,fx(0),GY+10,'ax');
  // chamadas
  leader(fx(-420),fy(735),fx(-360),fy(560),'TAMPO EM MADEIRA MACIÇA');
  leader(fx(-200),fy(690),fx(-150),fy(470),'TRAVESSA FRONTAL · METALON '+v(A)+' × '+v(B));
  leader(fx(260),fy(625),fx(150),fy(380),'CALHA ORGANIZADORA');
  leader(fx(0),fy(732),fx(40),fy(300),'PASSA-CABOS (OCULTOS)');
  leader(fx(-630),fy(250),fx(-540),fy(160),'PÉ · METALON '+v(B)+' × '+v(A));
  // cotas
  dimH(fx(-L/2),fy(H),fx(L/2),fy(H),108,v(L));
  dimH(fx(-L/2),fy(BH),fx(-BL/2),GY,GY+20,v(IN));
  dimH(fx(-BL/2),GY,fx(BL/2),GY,GY+20,v(BL));
  dimH(fx(BL/2),GY,fx(L/2),fy(BH),GY+20,v(IN));
  dimH(fx(FX),GY,fx(BL/2),GY,GY+36,v(B),{left:true});
  dimV(fx(L/2),fy(H),fx(L/2),fy(BH),fx(L/2)+16,v(T));
  dimV(fx(L/2),fy(H),fx(BL/2),GY,fx(L/2)+40,v(H));
  dimV(fx(-BL/2),fy(BH),fx(-BL/2),GY,fx(-L/2)-22,v(BH));
  dimV(fx(-200),fy(BH),fx(-200),fy(BH-A),fx(-260),v(A),{left:true});

  // ================= M03 — VISTA LATERAL =================
  const sx = z => 728+(-z+W/2)*S;              // frente (z+) à esquerda
  viewTitle(690,46,'M03','VISTA LATERAL DIREITA','ESCALA 1:10 · FRENTE À ESQUERDA');
  ground(sx(W/2+35),sx(-W/2-35),GY);
  // calha: parte visível pela janela do quadro
  path(`M${f(sx(-legZ))} ${f(fy(TR.y0))} L${f(sx(TR.z1))} ${f(fy(TR.y0))} L${f(sx(TR.z1))} ${f(fy(TR.y0+TR.lip))}`,'o');

(function(){
  const $=id=>document.getElementById(id);

  function curUnit(){ if(unit) return unit; const b=$('uCM'); return b && b.getAttribute('aria-pressed')==='true' ? 'cm' : 'mm'; }
  function render(){
    const u=curUnit();
    if(rendered!==u){ host.innerHTML=buildSheet(u); rendered=u; }
    $('sMM').setAttribute('aria-pressed',u==='mm'); $('sCM').setAttribute('aria-pressed',u==='cm');
  }
  function setZoom(z){
    const prev=zoom; zoom=Math.min(6,Math.max(1,z));
    const cx=(scroller.scrollLeft+scroller.clientWidth/2)/scroller.scrollWidth, cy=(scroller.scrollTop+scroller.clientHeight/2)/scroller.scrollHeight;
    host.classList.toggle('zoomed',zoom>1);
    scroller.classList.toggle('can-pan',zoom>1);
    host.style.width=(zoom*100)+'%';
    $('zFit').textContent=Math.round(zoom*100)+'%';
    if(prev!==zoom){ scroller.scrollLeft=cx*scroller.scrollWidth-scroller.clientWidth/2; scroller.scrollTop=cy*scroller.scrollHeight-scroller.clientHeight/2; }
  }
  function setMode(m){
    const svg=m==='svg';
    document.body.classList.toggle('svg-mode',svg);
    view.hidden=!svg;
    document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===m));
    if(svg){ unit=null; render(); }
  }
  document.querySelectorAll('.modes button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
  // unidade: a chave da prancha também muda a do 3D (e vice-versa)
  function pick(u){ unit=null; const main=$(u==='mm'?'uMM':'uCM'); if(main) main.click(); else unit=u; render(); }
  $('sMM').addEventListener('click',()=>pick('mm'));
  $('sCM').addEventListener('click',()=>pick('cm'));
  ['uMM','uCM'].forEach(id=>{ const b=$(id); if(b) b.addEventListener('click',()=>{ if(!view.hidden) render(); }); });
  $('zIn').addEventListener('click',()=>setZoom(zoom*1.5));
  $('zOut').addEventListener('click',()=>setZoom(zoom/1.5));
  $('zFit').addEventListener('click',()=>setZoom(1));
  scroller.addEventListener('wheel',e=>{ if(e.ctrlKey||e.metaKey){ e.preventDefault(); setZoom(zoom*(e.deltaY<0?1.15:1/1.15)); } },{passive:false});
  // Arrastar com o mouse para mover a prancha quando há zoom (no toque, a rolagem nativa já faz isso)
  let pan=null;
  scroller.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='mouse' || e.button!==0 || zoom<=1) return;
    const r=scroller.getBoundingClientRect(); if(e.clientX-r.left>=scroller.clientWidth || e.clientY-r.top>=scroller.clientHeight) return;   // clique na barra de rolagem
    pan={x:e.clientX,y:e.clientY,l:scroller.scrollLeft,t:scroller.scrollTop,id:e.pointerId};

  const endPan=e=>{ if(!pan) return; try{ scroller.releasePointerCapture(pan.id); }catch(_){} pan=null; scroller.classList.remove('panning'); };
  scroller.addEventListener('pointerup',endPan); scroller.addEventListener('pointercancel',endPan);
  // Setas do teclado também movem
  scroller.tabIndex=0;
  scroller.addEventListener('keydown',e=>{
    const d=80, m={ArrowLeft:[-d,0],ArrowRight:[d,0],ArrowUp:[0,-d],ArrowDown:[0,d]}[e.key];
    if(m){ scroller.scrollBy(m[0],m[1]); e.preventDefault(); }
  });
  // ---------- Download (SVG / PNG) ----------
  const dlBtn=$('dlBtn'), dlMenu=$('dlMenu'), dlStatus=$('dlStatus');
  function openMenu(open){ dlMenu.hidden=!open; dlBtn.setAttribute('aria-expanded',open); if(open) dlMenu.querySelector('button').focus(); }
  dlBtn.addEventListener('click',e=>{ e.stopPropagation(); openMenu(dlMenu.hidden); });
  document.addEventListener('click',e=>{ if(!dlMenu.hidden && !dlMenu.contains(e.target)) openMenu(false); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !dlMenu.hidden){ openMenu(false); dlBtn.focus(); } });
  function status(msg,err){ dlStatus.textContent=msg; dlStatus.classList.toggle('err',!!err); clearTimeout(status.t); if(msg) status.t=setTimeout(()=>dlStatus.textContent='',4000); }
  function svgToPng(svgStr,width){
    return new Promise((resolve,reject)=>{
      const img=new Image();
      const url=URL.createObjectURL(new Blob([svgStr],{type:'image/svg+xml;charset=utf-8'}));
      img.onload=()=>{
        try{
          const h=Math.round(width*990/1400), c=document.createElement('canvas'); c.width=width; c.height=h;
          const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,width,h); g.drawImage(img,0,0,width,h);
          URL.revokeObjectURL(url);
          c.toBlob(b=>b?resolve(b):reject(new Error('png')),'image/png');
        }catch(err){ URL.revokeObjectURL(url); reject(err); }
      };
      img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('svg')); };
      img.src=url;
    });
  }
  async function save(filename,data){
    // Dentro do claude.ai: capacidade "downloads" (o viewer confirma). Fora (GitHub/Vercel): link de download comum.
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if(dl){ await dl.save({filename,data}); return; }
    const blob = data instanceof Blob ? data : new Blob([data],{type:'image/svg+xml'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }
  dlMenu.querySelectorAll('button').forEach(b=>b.addEventListener('click',async()=>{
    openMenu(false);
    const u=curUnit(), svgStr=buildSheet(u), base='mesa-gamer-prancha-tecnica-'+u;
    try{
      if(b.dataset.fmt==='svg'){ status('Preparando SVG…'); await save(base+'.svg','<?xml version="1.0" encoding="UTF-8"?>\n'+svgStr); }
      else { status('Gerando PNG em alta resolução…'); const png=await svgToPng(svgStr,4800); await save(base+'.png',png); }
      status('Download pronto');
    }catch(err){
      const code=err&&err.code;
      if(code==='declined') status('Download cancelado');
      else if(code==='rate_limited') status('Já existe um download aguardando confirmação',true);
      else status('Não foi possível baixar aqui. Abra o site fora do chat e tente de novo.',true);
    }
  }));
  if(location.hash==='#svg') setMode('svg');
})();
</script>
